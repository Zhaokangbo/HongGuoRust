name: Windows M2 playback
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  playback:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare verified runtime and MSVC import library
        run: |
          $native = "$env:RUNNER_TEMP/mpv"
          ./scripts/prepare-mpv-msvc.ps1 -Destination $native
          $env:PATH = "$native;$env:PATH"
          ./scripts/check-ffmpeg-build.ps1
          python scripts/probe-mpv.py "$native/libmpv-2.dll"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "MPV_RUNTIME_DIR=$native" >> $env:GITHUB_ENV
          "LIB=$native;$env:LIB" >> $env:GITHUB_ENV
          $native >> $env:GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: src-tauri/target
          key: windows-m2-debug-${{ hashFiles('src-tauri/Cargo.lock') }}-v1
      - name: Build and test the desktop player
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --manifest-path src-tauri/Cargo.toml --features custom-protocol --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: HongGuoRust-M2-debug-x64
          path: src-tauri/target/debug/hongguorust.exe
          if-no-files-found: error
      # Hosted runner cannot apply 150% scaling to its active desktop session.
      # The 150% display and restore checks are verified on physical Windows.
      - name: Test embedded pixels and playing-window close
        run: |
          foreach ($name in 'AudioEndpointBuilder','Audiosrv') {
            $service = Get-Service $name -ErrorAction SilentlyContinue
            if ($service -and $service.Status -ne 'Running') {
              try { Start-Service $name -ErrorAction Stop } catch { Write-Output "Audio service $name unavailable: $_" }
            }
          }
          Get-Service AudioEndpointBuilder,Audiosrv -ErrorAction SilentlyContinue | Format-Table Name,Status
          python -m pip install imageio-ffmpeg==0.6.0 pillow==12.2.0 PyAudioWPatch==0.2.12.8 pywinauto==0.6.9 psutil==7.1.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:HONGGUORUST_LOG_DIR = Join-Path $env:GITHUB_WORKSPACE 'diagnostics'
          python scripts/smoke-player.py src-tauri/target/debug/hongguorust.exe
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-playback-diagnostics
          path: diagnostics/
          if-no-files-found: ignore

  tag-m2:
    needs: playback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase1-m2]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Tag after both main Windows workflows pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --event push --branch main --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId')
          test -n "$id"
          gh run watch -R "$GITHUB_REPOSITORY" "$id" --exit-status --interval 20
          api="repos/$GITHUB_REPOSITORY/git"
          existing=$(gh api "$api/matching-refs/tags/phase1-m2" --jq '.[] | select(.ref == "refs/tags/phase1-m2") | .object.sha')
          if [[ -n "$existing" ]]; then test "$existing" = "$GITHUB_SHA"; else
            gh api --method POST "$api/refs" -f ref=refs/tags/phase1-m2 -f sha="$GITHUB_SHA"
          fi

  tag-m3:
    needs: playback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase1-m3]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Tag after both main Windows workflows pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --event push --branch main --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId')
          test -n "$id"
          gh run watch -R "$GITHUB_REPOSITORY" "$id" --exit-status --interval 20
          api="repos/$GITHUB_REPOSITORY/git"
          existing=$(gh api "$api/matching-refs/tags/phase1-m3" --jq '.[] | select(.ref == "refs/tags/phase1-m3") | .object.sha')
          if [[ -n "$existing" ]]; then test "$existing" = "$GITHUB_SHA"; else
            gh api --method POST "$api/refs" -f ref=refs/tags/phase1-m3 -f sha="$GITHUB_SHA"
          fi

  tag-m4:
    needs: playback
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase1-m4]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Tag after both main Windows workflows pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow windows.yml --event push --branch main --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId')
          test -n "$id"
          gh run watch -R "$GITHUB_REPOSITORY" "$id" --exit-status --interval 20
          api="repos/$GITHUB_REPOSITORY/git"
          existing=$(gh api "$api/matching-refs/tags/phase1-m4" --jq '.[] | select(.ref == "refs/tags/phase1-m4") | .object.sha')
          if [[ -n "$existing" ]]; then test "$existing" = "$GITHUB_SHA"; else
            gh api --method POST "$api/refs" -f ref=refs/tags/phase1-m4 -f sha="$GITHUB_SHA"
          fi
