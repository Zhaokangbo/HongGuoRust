name: Windows M2 dependency probe
on:
  push:
    branches: ['feat/m2-player']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Record dependency advisories
        run: |
          npm audit --json > audit-all.json
          npm audit --omit=dev --json > audit-production.json
          foreach ($path in 'audit-all.json','audit-production.json') {
            $report = Get-Content -Raw $path | ConvertFrom-Json
            if ($null -eq $report.metadata.vulnerabilities) { throw "No advisory report from $path" }
            Write-Output $path
            $report.vulnerabilities | ConvertTo-Json -Depth 12
            $report.metadata.vulnerabilities | ConvertTo-Json
          }
          exit 0
      - name: Resolve probe dependency graph
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --features mpv-probe --format-version 1 > "$env:RUNNER_TEMP/metadata.json"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff -U3 -- src-tauri/Cargo.lock
          $pkg = (Get-Content -Raw "$env:RUNNER_TEMP/metadata.json" | ConvertFrom-Json).packages
          foreach ($crate in @($pkg | Where-Object name -like 'libmpv2*')) {
            Write-Output "$($crate.name) $($crate.version) license=$($crate.license)"
            $root = Split-Path $crate.manifest_path
            if (Test-Path "$root/build.rs") { Get-Content "$root/build.rs" }
          }
          npm install --save-dev --save-exact --package-lock-only vite@6.4.6
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff -U3 -- package.json package-lock.json
      - name: Verify and inspect the native runtime
        run: |
          ./scripts/get-mpv.ps1 -Destination "$env:RUNNER_TEMP/mpv"
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          $dump = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" | Select-Object -Last 1
          & $dump.FullName /dependents "$env:RUNNER_TEMP/mpv/libmpv-2.dll"
          Get-WindowsFeature Server-Media-Foundation
          python scripts/probe-mpv.py "$env:RUNNER_TEMP/mpv/libmpv-2.dll"
