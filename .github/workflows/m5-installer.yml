name: Windows M5 NSIS candidate
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-windows.ps1'
      - 'scripts/get-mpv.ps1'
      - 'scripts/prepare-mpv-msvc.ps1'
      - 'scripts/smoke-installer.ps1'
      - 'scripts/smoke-windows.ps1'
      - 'scripts/smoke-player.py'
      - 'scripts/probe-mpv.py'
      - 'src-tauri/tauri.bundle.conf.json'
      - 'src-tauri/windows/hooks.nsh'
      - 'docs/acceptance/m5.md'
      - 'docs/architecture/ffmpeg-config-inventory.json'
      - 'docs/architecture/mpv-binary-evidence.md'
      - 'scripts/check-m5-provenance.ps1'
      - 'src-tauri/legal/**'
      - 'LICENSE'
      - '.github/workflows/m5-installer.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feat/m5-installer'
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust x64 MSVC and rustfmt
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install checked Tauri CLI 2.11.4
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          $cli = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          Invoke-WebRequest 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3') {
            throw 'Tauri CLI archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $cli
          $binary = @(Get-ChildItem $cli -Recurse -Filter cargo-tauri.exe -File)
          if ($binary.Count -ne 1) { throw 'Expected exactly one cargo-tauri.exe in verified archive' }
          $binary[0].DirectoryName >> $env:GITHUB_PATH
      - name: Validate installer configuration and PowerShell syntax
        shell: pwsh
        run: |
          $config = Get-Content src-tauri/tauri.bundle.conf.json -Raw | ConvertFrom-Json
          if (-not $config.bundle.active -or $config.bundle.targets[0] -ne 'nsis') { throw 'NSIS configuration is disabled' }
          foreach ($resource in @('../LICENSE','legal/THIRD-PARTY-NOTICES.txt','legal/VULKAN-LOADER-LICENSE.txt','legal/VULKAN-HEADERS-LICENSE.md','legal/MPV-LGPL-2.1.txt','legal/FFMPEG-LGPL-3.0.txt','legal/MPV-COPYRIGHT-REFERENCE.txt','legal/FFMPEG-LICENSE-REFERENCE.md')) {
            if (-not $config.bundle.resources.PSObject.Properties[$resource]) {
              throw "Missing installer legal resource mapping: $resource"
            }
          }
          foreach ($script in @('scripts/build-windows.ps1','scripts/get-mpv.ps1','scripts/smoke-installer.ps1','scripts/check-m5-provenance.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse errors in $script : $errors" }
          }
      - name: Validate exact FFmpeg upstream inventory (not license approval)
        shell: pwsh
        run: |
          ./scripts/check-m5-provenance.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Prototype installer build (no distributable artifact)
        shell: pwsh
        run: |
          ./scripts/build-windows.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install installed-player playback probe dependencies
        shell: pwsh
        run: |
          foreach ($name in 'AudioEndpointBuilder','Audiosrv') {
            $service = Get-Service $name -ErrorAction SilentlyContinue
            if ($service -and $service.Status -ne 'Running') {
              try { Start-Service $name -ErrorAction Stop } catch { Write-Output "Audio service $name unavailable: $_" }
            }
          }
          python -m pip install imageio-ffmpeg==0.6.0 pillow==12.2.0 PyAudioWPatch==0.2.12.8 pywinauto==0.6.9 psutil==7.1.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate candidate installation, actual IPC, bundled DLL, real playback and uninstall
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw "Expected one NSIS setup, found $($setup.Count)" }
          ./scripts/smoke-installer.ps1 -Installer $setup[0].FullName -AuditReport 'build-evidence/m5-package-report.json' -CandidateCommit '${{ github.event.pull_request.head.sha || github.sha }}' -VerifyPlayback
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Assert native runtime never entered git tracking
        shell: pwsh
        run: |
          if (Test-Path 'src-tauri/resources/libmpv-2.dll' -PathType Leaf) {
            throw 'Untracked libmpv staging left behind after package step'
          }
          if (Test-Path 'src-tauri/resources/vulkan-1.dll' -PathType Leaf) {
            throw 'Untracked Vulkan loader staging left behind after package step'
          }
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Upload binary-free candidate audit evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: m5-package-evidence
          path: build-evidence/m5-package-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI/window diagnostics only if candidate smoke fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m5-installed-app-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      # Upload ONLY text JSON evidence. Do NOT upload setup.exe, the installed app,
      # libmpv DLL, or Vulkan DLL before redistribution audit and clean-Windows acceptance.
