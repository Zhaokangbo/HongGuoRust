name: Windows M1
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Feature branches are verified by their PRs, not a redundant push run.
# Superseded PR checks are cancelled to avoid Windows runner congestion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install verified Tauri CLI 2.11.4
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          $cli = Join-Path $env:RUNNER_TEMP 'tauri-cli'
          Invoke-WebRequest 'https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.11.4/cargo-tauri-x86_64-pc-windows-msvc.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '0743e30a661a35d63339b24cf63828f97ba5389a1d7f13b368a542794dd0a3f3') {
            throw 'Tauri CLI archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $cli
          $binary = @(Get-ChildItem $cli -Recurse -Filter cargo-tauri.exe -File)
          if ($binary.Count -ne 1) { throw 'Expected one cargo-tauri.exe in the verified archive' }
          $binary[0].DirectoryName >> $env:GITHUB_PATH
      - run: ./scripts/check-windows.ps1
      - run: npm ci
      - run: npm run build
      - name: Verify committed dependencies
        run: |
          git ls-files --error-unmatch package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo metadata --manifest-path src-tauri/Cargo.toml --locked --format-version 1 | Out-Null
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare Windows media runtime
        run: |
          $native = "$env:RUNNER_TEMP/mpv"
          ./scripts/prepare-mpv-msvc.ps1 -Destination $native
          "LIB=$native;$env:LIB" >> $env:GITHUB_ENV
          $native >> $env:GITHUB_PATH
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo tauri build --no-bundle -- --locked
      - name: Stage Windows validation files
        run: |
          New-Item -ItemType Directory -Path validation | Out-Null
          Copy-Item src-tauri/target/release/hongguorust.exe,scripts/get-mpv.ps1,scripts/prepare-mpv-msvc.ps1,docs/acceptance/run-windows.md,docs/acceptance/m3.md,docs/acceptance/m4.md -Destination validation
      - uses: actions/upload-artifact@v4
        with:
          name: HongGuoRust-M4-windows-x64
          path: validation/
          if-no-files-found: error
      - name: Verify live IPC and normal process exit
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-ipc-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
      - name: Check for dependency drift
        run: git diff --exit-code -- package-lock.json src-tauri/Cargo.lock

  tag-m1:
    needs: desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[phase1-m1]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the validated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/git"
          existing=$(gh api "$api/matching-refs/tags/phase1-m1" --jq '.[] | select(.ref == "refs/tags/phase1-m1") | .object.sha')
          if [[ -n "$existing" ]]; then
            [[ "$existing" == "$GITHUB_SHA" ]] || { echo 'phase1-m1 already points to another commit'; exit 1; }
            exit 0
          fi
          gh api --method POST "$api/refs" -f ref=refs/tags/phase1-m1 -f sha="$GITHUB_SHA"
