name: Windows M1
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Rust tooling
        run: |
          rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo install tauri-cli --version 2.11.4 --locked
      - run: ./scripts/check-windows.ps1
      - run: npm ci
      - run: npm run build
      - name: Resolve missing initial lockfile
        if: hashFiles('src-tauri/Cargo.lock') == ''
        run: cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock
          if-no-files-found: error
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo tauri build --no-bundle -- --locked
      - name: Verify live IPC and normal process exit
        shell: powershell
        run: ./scripts/smoke-windows.ps1
      - name: Require committed lockfiles
        run: |
          git ls-files --error-unmatch package-lock.json src-tauri/Cargo.lock
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git diff --exit-code -- package-lock.json src-tauri/Cargo.lock
